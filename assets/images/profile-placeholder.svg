<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Tech Circles -->
  <circle cx="200" cy="190" r="140" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="190" r="115" fill="rgba(16, 185, 129, 0.05)" stroke="url(#neonEmerald)" stroke-width="2" />

  <!-- Developer Silhouette / Avatar Representation -->
  <!-- Shoulders / Torso -->
  <path d="M 120 330 C 120 270, 150 250, 200 250 C 250 250, 280 270, 280 330 Z" fill="url(#indigoGlow)" opacity="0.85" />
  
  <!-- Collar / Shirt Detail -->
  <polygon points="185,250 200,280 215,250" fill="#0f172a" />
  <line x1="200" y1="280" x2="200" y2="330" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Head -->
  <circle cx="200" cy="180" r="50" fill="#f8fafc" opacity="0.9" />
  
  <!-- Sleek Hair / Cap Shape -->
  <path d="M 150 180 C 150 135, 175 125, 200 125 C 225 125, 250 135, 250 180 C 240 160, 210 150, 200 150 C 190 150, 160 160, 150 180 Z" fill="#0f172a" />

  <!-- Developer Smart Glasses -->
  <rect x="168" y="170" width="26" height="14" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <rect x="206" y="170" width="26" height="14" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <line x1="194" y1="177" x2="206" y2="177" stroke="#10b981" stroke-width="2" />
  <line x1="155" y1="175" x2="168" y2="175" stroke="#10b981" stroke-width="2" />
  <line x1="232" y1="175" x2="245" y2="175" stroke="#10b981" stroke-width="2" />

  <!-- Glowing Code / Tech Accents -->
  <text x="60" y="80" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" opacity="0.7">&lt;Ashwinth /&gt;</text>
  <text x="270" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" opacity="0.8">Java Dev</text>

  <!-- Glowing Status Ring -->
  <circle cx="270" cy="130" r="12" fill="#10b981" filter="url(#glow)" />
  <circle cx="270" cy="130" r="6" fill="#ffffff" />
</svg>
